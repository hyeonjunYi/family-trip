<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026년 11월 하이원 리조트 2박 3일 온 가족 여행</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    :root {
      /* Brand & Accent */
      --colors-primary: #0066cc;
      --colors-primary-focus: #0071e3;
      --colors-primary-on-dark: #2997ff;

      /* Surface */
      --colors-canvas: #ffffff;
      --colors-canvas-parchment: #f5f5f7;
      --colors-surface-pearl: #fafafc;
      --colors-surface-tile-1: #272729;
      --colors-surface-tile-2: #2a2a2c;
      --colors-surface-tile-3: #252527;
      --colors-surface-black: #000000;
      --colors-surface-chip-translucent: rgba(210, 210, 215, 0.64);

      /* Text */
      --colors-ink: #1d1d1f;
      --colors-body: #1d1d1f;
      --colors-body-on-dark: #ffffff;
      --colors-body-muted: #cccccc;
      --colors-ink-muted-80: #333333;
      --colors-ink-muted-48: #7a7a7a;

      /* Hairlines & Borders */
      --colors-divider-soft: rgba(0, 0, 0, 0.04);
      --colors-hairline: #e0e0e0;

      /* Spacing */
      --spacing-xxs: 4px;
      --spacing-xs: 8px;
      --spacing-sm: 12px;
      --spacing-md: 17px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-xxl: 48px;
      --spacing-section: 80px;

      /* Shapes */
      --rounded-none: 0px;
      --rounded-xs: 5px;
      --rounded-sm: 8px;
      --rounded-md: 11px;
      --rounded-lg: 18px;
      --rounded-pill: 9999px;
      --rounded-full: 50%;

      /* Elevation (Single media-frame shadow only) */
      --shadow-product: rgba(0, 0, 0, 0.22) 3px 5px 30px 0;

      /* Fonts */
      --font-display: "SF Pro Display", "Inter", "Pretendard Variable", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-text: "SF Pro Text", "Inter", "Pretendard Variable", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-text);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.47;
      letter-spacing: -0.374px;
      color: var(--colors-body);
      background-color: var(--colors-canvas);
      font-feature-settings: "ss03";
      -webkit-font-smoothing: antialiased;
    }

    /* Global Nav (44px, pure black) */
    .global-nav {
      background-color: var(--colors-surface-black);
      height: 44px;
      width: 100%;
      color: var(--colors-body-on-dark);
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.12px;
    }

    .global-nav-inner {
      max-width: 1068px;
      height: 100%;
      margin: 0 auto;
      padding: 0 var(--spacing-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .global-nav-left {
      color: var(--colors-body-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #34c759;
      margin-right: 6px;
      vertical-align: middle;
    }

    .sync-status-dot.offline {
      background-color: #ff9f0a;
    }

    .global-nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }

    .global-utility-link {
      background: transparent;
      border: none;
      color: var(--colors-body-on-dark);
      font-family: inherit;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.12px;
      cursor: pointer;
      padding: 6px 4px;
      opacity: 0.9;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .global-utility-link:active {
      transform: scale(0.95);
    }

    /* Sub-Nav Frosted (52px, sticky) */
    .sub-nav-frosted {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 52px;
      background-color: rgba(245, 245, 247, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .sub-nav-inner {
      max-width: 1068px;
      height: 100%;
      margin: 0 auto;
      padding: 0 var(--spacing-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .sub-nav-brand {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 600;
      line-height: 1.19;
      letter-spacing: 0.231px;
      color: var(--colors-ink);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sub-nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-nav-links::-webkit-scrollbar {
      display: none;
    }

    .sub-nav-tab {
      background: transparent;
      border: none;
      border-radius: var(--rounded-pill);
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.29;
      letter-spacing: -0.224px;
      color: var(--colors-ink);
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .sub-nav-tab:active {
      transform: scale(0.95);
    }

    .sub-nav-tab.active {
      background-color: var(--colors-primary);
      color: #ffffff;
    }

    /* Apple Button Grammar */
    .button-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--colors-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--rounded-pill);
      font-family: var(--font-text);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.374px;
      padding: 11px 22px;
      min-height: 44px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .button-primary:active {
      transform: scale(0.95);
    }

    .button-primary:focus-visible {
      outline: 2px solid var(--colors-primary-focus);
      outline-offset: 2px;
    }

    .button-primary.compact {
      font-size: 14px;
      line-height: 1.29;
      letter-spacing: -0.224px;
      padding: 7px 15px;
      min-height: 34px;
    }

    .button-secondary-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      color: var(--colors-primary);
      border: 1px solid var(--colors-primary);
      border-radius: var(--rounded-pill);
      font-family: var(--font-text);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.374px;
      padding: 10px 21px;
      min-height: 44px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .button-secondary-pill:active {
      transform: scale(0.95);
    }

    .button-pearl-capsule {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--colors-surface-pearl);
      color: var(--colors-ink-muted-80);
      border: 3px solid var(--colors-divider-soft);
      border-radius: var(--rounded-md);
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
      letter-spacing: -0.224px;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .button-pearl-capsule:active {
      transform: scale(0.95);
    }

    .button-dark-utility {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--colors-ink);
      color: var(--colors-body-on-dark);
      border: none;
      border-radius: var(--rounded-sm);
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.29;
      letter-spacing: -0.224px;
      padding: 8px 15px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .button-dark-utility:active {
      transform: scale(0.95);
    }

    /* Full-Bleed Alternating Tiles (0px radius, edge-to-edge) */
    .tile-light {
      background-color: var(--colors-canvas);
      color: var(--colors-ink);
      padding: var(--spacing-section) var(--spacing-lg);
      border-radius: var(--rounded-none);
    }

    .tile-parchment {
      background-color: var(--colors-canvas-parchment);
      color: var(--colors-ink);
      padding: var(--spacing-section) var(--spacing-lg);
      border-radius: var(--rounded-none);
    }

    .tile-dark {
      background-color: var(--colors-surface-tile-1);
      color: var(--colors-body-on-dark);
      padding: var(--spacing-section) var(--spacing-lg);
      border-radius: var(--rounded-none);
    }

    .tile-inner {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Hero Header Tile */
    .hero-header-stack {
      text-align: center;
      padding-top: 16px;
      padding-bottom: 16px;
    }

    .hero-eyebrow {
      font-family: var(--font-text);
      font-size: 21px;
      font-weight: 600;
      line-height: 1.19;
      letter-spacing: 0.231px;
      color: var(--colors-primary);
      margin-bottom: 12px;
    }

    .hero-headline {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 600;
      line-height: 1.07;
      letter-spacing: -0.28px;
      color: var(--colors-ink);
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .hero-lead {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.14;
      letter-spacing: 0.196px;
      color: var(--colors-ink);
      margin-bottom: 28px;
    }

    .hero-cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Section Tile Headings */
    .section-head-stack {
      text-align: center;
      margin-bottom: 48px;
    }

    .section-display-lg {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0;
      margin-bottom: 10px;
    }

    .section-tagline {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 400;
      line-height: 1.19;
      letter-spacing: 0.231px;
      color: var(--colors-ink-muted-48);
    }

    .tile-dark .section-tagline {
      color: var(--colors-body-muted);
    }

    /* Store Utility Card Grid (18px radius, 1px hairline, no box-shadow) */
    .utility-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .store-utility-card {
      background-color: var(--colors-canvas);
      color: var(--colors-ink);
      border: 1px solid var(--colors-hairline);
      border-radius: var(--rounded-lg);
      padding: var(--spacing-lg);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .store-utility-card:active {
      transform: scale(0.985);
    }

    .tile-dark .store-utility-card {
      background-color: var(--colors-surface-tile-2);
      color: var(--colors-body-on-dark);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-time-label {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.29;
      letter-spacing: -0.224px;
      color: var(--colors-primary);
    }

    .tile-dark .card-time-label {
      color: var(--colors-primary-on-dark);
    }

    .card-status-chip {
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.12px;
      padding: 5px 10px;
      border-radius: var(--rounded-xs);
      background-color: var(--colors-canvas-parchment);
      color: var(--colors-ink-muted-80);
    }

    .tile-dark .card-status-chip {
      background-color: var(--colors-surface-tile-3);
      color: var(--colors-body-muted);
    }

    .card-title-strong {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.24;
      letter-spacing: -0.374px;
      margin-bottom: 6px;
      word-break: keep-all;
    }

    .card-body-copy {
      font-size: 17px;
      font-weight: 400;
      line-height: 1.47;
      letter-spacing: -0.374px;
      color: var(--colors-ink-muted-80);
      word-break: keep-all;
    }

    .tile-dark .card-body-copy {
      color: var(--colors-body-muted);
    }

    .card-footer-link-row {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--colors-divider-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tile-dark .card-footer-link-row {
      border-top-color: rgba(255, 255, 255, 0.08);
    }

    .text-link-action {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
      letter-spacing: -0.224px;
      color: var(--colors-primary);
    }

    .tile-dark .text-link-action {
      color: var(--colors-primary-on-dark);
    }

    .winner-inline-tag {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.29;
      letter-spacing: -0.224px;
      color: var(--colors-primary);
    }

    .tile-dark .winner-inline-tag {
      color: var(--colors-primary-on-dark);
    }

    /* Empty-Ready Packing Checklist Section */
    .checklist-card {
      background-color: var(--colors-canvas);
      border: 1px solid var(--colors-hairline);
      border-radius: var(--rounded-lg);
      padding: var(--spacing-lg);
    }

    .checklist-add-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input-pill {
      flex: 1;
      min-width: 200px;
      height: 44px;
      background-color: var(--colors-canvas);
      color: var(--colors-ink);
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: var(--rounded-pill);
      font-family: var(--font-text);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.374px;
      padding: 10px 20px;
    }

    .search-input-pill:focus {
      outline: 2px solid var(--colors-primary-focus);
      border-color: transparent;
    }

    .empty-state-box {
      text-align: center;
      padding: 36px 16px;
      color: var(--colors-ink-muted-48);
      font-size: 17px;
    }

    .checklist-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--colors-divider-soft);
    }

    .checklist-item-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .checklist-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1;
    }

    .apple-checkbox {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--colors-ink-muted-48);
      background-color: var(--colors-canvas);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }

    .apple-checkbox:checked {
      background-color: var(--colors-primary);
      border-color: var(--colors-primary);
    }

    .apple-checkbox:checked::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 11px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .checklist-item-text {
      font-size: 17px;
      color: var(--colors-ink);
    }

    .checklist-item-row.checked .checklist-item-text {
      text-decoration: line-through;
      color: var(--colors-ink-muted-48);
    }

    .item-remove-link {
      background: transparent;
      border: none;
      color: var(--colors-ink-muted-48);
      font-family: var(--font-text);
      font-size: 14px;
      cursor: pointer;
      padding: 6px 10px;
    }

    /* Overlay & Modal Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: rgba(0, 0, 0, 0.48);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-sheet {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -48%) scale(0.98);
      z-index: 60;
      width: calc(100vw - 32px);
      max-width: 820px;
      max-height: 88vh;
      overflow-y: auto;
      background-color: var(--colors-canvas);
      color: var(--colors-ink);
      border-radius: var(--rounded-lg);
      border: 1px solid var(--colors-hairline);
      padding: 32px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .detail-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .sheet-top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .sheet-headline {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -0.2px;
    }

    .button-icon-circular {
      width: 44px;
      height: 44px;
      border-radius: var(--rounded-full);
      background-color: var(--colors-surface-chip-translucent);
      color: var(--colors-ink);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .button-icon-circular:active {
      transform: scale(0.95);
    }

    .sheet-subcopy {
      font-size: 17px;
      color: var(--colors-ink-muted-80);
      margin-bottom: 20px;
    }

    /* Interactive Map Box inside Sheet */
    .map-preview-panel {
      background-color: var(--colors-canvas-parchment);
      border-radius: var(--rounded-lg);
      padding: 16px;
      margin-bottom: 20px;
    }

    .map-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .map-panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--colors-ink);
    }

    .map-frame-wrap {
      width: 100%;
      height: 220px;
      border-radius: var(--rounded-sm);
      overflow: hidden;
      border: 1px solid var(--colors-hairline);
      background-color: var(--colors-canvas);
      margin-bottom: 12px;
    }

    .map-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .map-link-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Anonymous Voter Selector */
    .voter-strip {
      background-color: var(--colors-canvas-parchment);
      border-radius: var(--rounded-lg);
      padding: 16px;
      margin-bottom: 20px;
    }

    .voter-strip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      font-size: 14px;
      font-weight: 600;
    }

    .voter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .configurator-chip {
      background-color: var(--colors-canvas);
      color: var(--colors-ink);
      border: 1px solid var(--colors-hairline);
      border-radius: var(--rounded-pill);
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: 400;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .configurator-chip:active {
      transform: scale(0.95);
    }

    .configurator-chip.selected {
      border: 2px solid var(--colors-primary-focus);
      font-weight: 600;
    }

    /* 5-Option Video / Restaurant Vote List */
    .vote-cards-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .vote-option-tile {
      background-color: var(--colors-canvas);
      border: 1px solid var(--colors-hairline);
      border-radius: var(--rounded-lg);
      padding: 20px;
      text-align: left;

    function getAnonymousStatsForOptions(voteKey, optionsCount) {
      const itemVotes = appState.votes[voteKey] || {};
      const counts = Array(optionsCount).fill(0);

      MEMBERS.forEach(m => {
        const idx = itemVotes[m];
        if (typeof idx === "number" && idx >= 0 && idx < optionsCount) {
          counts[idx]++;
        }
      });

      const totalVotes = counts.reduce((a, b) => a + b, 0);
      let maxCount = 0;
      let topIndices = [];

      counts.forEach((c, idx) => {
        if (c > maxCount) {
          maxCount = c;
          topIndices = [idx];
        } else if (c === maxCount && c > 0) {
          topIndices.push(idx);
        }
      });

      return { counts, totalVotes, maxCount, topIndices };
    }

    let toastTimer = null;
    function showToast(msg) {
      toastPill.textContent = msg;
      toastPill.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastPill.classList.remove("show"), 2400);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function copyCleanSiteUrl() {
      const cleanUrl = `${window.location.origin}${window.location.pathname}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(cleanUrl).then(() => {
          showToast("가족방 공유 주소가 복사되었습니다.");
        });
      } else {
        showToast("주소창의 URL을 복사해 공유해 주세요.");
      }
    }

    document.getElementById("btnShareUrl").addEventListener("click", copyCleanSiteUrl);
    document.getElementById("btnHeroShare").addEventListener("click", copyCleanSiteUrl);

    function renderDayTile(day, overrideClass) {
      const tileClass = overrideClass || day.tileClass;
      const cardsHtml = day.items.map(item => {
        const isVotable = Array.isArray(item.options) && item.options.length > 0;
        let statusHtml = "";
        let footerRightHtml = `<span class="text-link-action">지도 보기 &rsaquo;</span>`;

        if (isVotable) {
          const stats = getAnonymousStatsForOptions(item.id, item.options.length);
          statusHtml = `<span class="card-status-chip">무기명 투표 ${stats.totalVotes}/5</span>`;
          const previewLabel = item.optionType === "video" ? "영상·지도 보고 투표하기" : "식당 사진·지도 보고 투표하기";
          if (stats.totalVotes > 0 && stats.topIndices.length > 0) {
            const topNames = stats.topIndices.map(i => item.options[i].name).join(" · ");
            footerRightHtml = `<span class="winner-inline-tag">1위 · ${topNames} (${stats.maxCount}표) &rsaquo;</span>`;
          } else {
            footerRightHtml = `<span class="text-link-action">${previewLabel} &rsaquo;</span>`;
          }
        } else {
          statusHtml = `<span class="card-status-chip">${item.statusText || "확정"}</span>`;
        }

        return `
          <article class="store-utility-card" role="button" tabindex="0" data-day-id="${day.id}" data-item-id="${item.id}">
            <div>
              <div class="card-top-meta">
                <span class="card-time-label">${item.time}</span>
                ${statusHtml}
              </div>
              <h3 class="card-title-strong">${item.title}</h3>
              <p class="card-body-copy">${item.sub}</p>
            </div>
            <div class="card-footer-link-row">
              ${footerRightHtml}
            </div>
          </article>
        `;
      }).join("");

      return `
        <section class="${tileClass}" id="section-${day.id}">
          <div class="tile-inner">
            <div class="section-head-stack">
              <h2 class="section-display-lg">${day.headline}</h2>
              <p class="section-tagline">${day.tagline}</p>
            </div>
            <div class="utility-grid">
              ${cardsHtml}
            </div>
          </div>
        </section>
      `;
    }

    function renderChecklistTile(tileClass) {
      const items = getChecklistArray();
      const listHtml = items.length === 0
        ? `<div class="empty-state-box">등록된 준비물이 없습니다. 위 입력창에 필요한 물건을 추가해 보세요.</div>`

                <input type="checkbox" class="apple-checkbox" data-chk-key="${entry.key}" ${entry.checked ? "checked" : ""} />

              </label>
              <button type="button" class="item-remove-link" data-del-chk="${entry.key}">삭제</button>
            </div>
          `).join("");

      return `
        <section class="${tileClass}" id="section-checklist">
          <div class="tile-inner">
            <div class="section-head-stack">
              <h2 class="section-display-lg">온 가족 준비물</h2>
              <p class="section-tagline">누구든 생각날 때마다 추가하면 모든 가족 폰에 실시간 공유됩니다</p>
            </div>
            <div class="checklist-card">
              <form class="checklist-add-bar" id="checklistAddForm">
                <input type="text" class="search-input-pill" id="newChecklistInput" placeholder="추가할 준비물 입력 (예: 수영모, 보드게임, 상비약)" required />
                <button type="submit" class="button-primary">추가</button>
              </form>
              <div>${listHtml}</div>
            </div>
          </div>
        </section>
      `;
    }

    function renderMainSections() {
      const tripData = buildDynamicTripData();
      let html = "";

      if (activeTab === "all") {
        html += tripData.map(d => renderDayTile(d)).join("");
      } else if (activeTab === "checklist") {
        html += renderChecklistTile("tile-parchment");
      } else {
        const day = tripData.find(d => d.id === activeTab);
        if (day) html += renderDayTile(day, "tile-parchment");
      }

      mainSections.innerHTML = html;

      mainSections.querySelectorAll(".store-utility-card").forEach(card => {
        const handler = () => {
          const dayId = card.getAttribute("data-day-id");
          const itemId = card.getAttribute("data-item-id");
          openItemSheet(dayId, itemId);
        };
        card.addEventListener("click", handler);
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            handler();
          }
        });
      });

      const chkForm = document.getElementById("checklistAddForm");
      if (chkForm) {
        chkForm.addEventListener("submit", e => {
          e.preventDefault();
          const input = document.getElementById("newChecklistInput");
          const val = input.value.trim();
          if (!val) return;

          const newItem = { text: val, checked: false, createdAt: Date.now() };
          if (tripRef) {
            tripRef.child("checklist").push(newItem);
          } else {
            const localKey = "local_" + Date.now();
            appState.checklistMap[localKey] = newItem;
            saveLocalCache();
            renderSubNav();
            renderMainSections();
          }
          input.value = "";
          showToast(`'${val}' 준비물이 추가되었습니다.`);
        });
      }

      mainSections.querySelectorAll("[data-chk-key]").forEach(box => {
        box.addEventListener("change", e => {
          const key = e.target.getAttribute("data-chk-key");
          const checked = e.target.checked;
          if (tripRef) {
            tripRef.child(`checklist/${key}/checked`).set(checked);
          } else if (appState.checklistMap[key]) {
            appState.checklistMap[key].checked = checked;
            saveLocalCache();
          }
          e.target.closest(".checklist-item-row").classList.toggle("checked", checked);
        });
      });

      mainSections.querySelectorAll("[data-del-chk]").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-del-chk");
          if (tripRef) {
            tripRef.child(`checklist/${key}`).remove();
          } else {
            delete appState.checklistMap[key];
            saveLocalCache();
            renderSubNav();
            renderMainSections();
          }
        });
      });
    }

    function findItemById(dayId, itemId) {
      const tripData = buildDynamicTripData();
      const day = tripData.find(d => d.id === dayId);
      return day ? day.items.find(i => i.id === itemId) : null;
    }

    function buildOsmEmbedUrl(lat, lng) {
      const delta = 0.022;
      const bbox = `${(lng - delta).toFixed(4)},${(lat - delta).toFixed(4)},${(lng + delta).toFixed(4)},${(lat + delta).toFixed(4)}`;
      return `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lng}`;
    }

    function renderMapBlock(lat, lng, searchQuery, addressText) {
      const qEncoded = encodeURIComponent(searchQuery);
      const embedUrl = buildOsmEmbedUrl(lat, lng);
      return `
        <div class="map-preview-panel">
          <div class="map-panel-header">
            <span class="map-panel-title">위치 지도 · ${escapeHtml(addressText)}</span>
            <button type="button" class="button-pearl-capsule" id="btnSheetCopyAddr">주소 복사</button>

          <div class="map-frame-wrap">
            <iframe title="위치 지도" src="${embedUrl}" loading="lazy"></iframe>
          </div>
          <div class="map-link-row">
            <a href="https://map.naver.com/p/search/${qEncoded}" target="_blank" rel="noopener" class="button-primary compact">네이버 지도 열기</a>
            <a href="https://map.kakao.com/link/search/${qEncoded}" target="_blank" rel="noopener" class="button-dark-utility">카카오맵 열기</a>
          </div>
        </div>
      `;
    }

          const isLeading = stats.topIndices.includes(idx) && count > 0;

          let mediaHtml = "";
          if (item.optionType === "video") {
            const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(opt.youtubeSearch)}`;
            if (opt.videoId) {
              const thumbUrl = `https://i.ytimg.com/vi/${opt.videoId}/hqdefault.jpg`;
              const isPlaying = playingVideoOptIdx === idx;
              mediaHtml = `
                <div class="media-preview-row">
                  <div class="yt-thumb-box">
                    <img src="${thumbUrl}" alt="${escapeHtml(opt.videoTitle)}" loading="lazy" />
                    <span class="yt-play-badge">▶ 실제 영상</span>
                  </div>
                  <div class="media-action-col">
                    <span class="video-title-caption">${escapeHtml(opt.videoTitle)}</span>
                    <div class="media-btn-group">
                      <button type="button" class="button-primary compact" data-play-video="${idx}">
                        ${isPlaying ? "영상 닫기" : "영상 바로 재생"}
                      </button>
                      <a href="${ytSearchUrl}" target="_blank" rel="noopener" class="button-pearl-capsule" data-stop-prop="true">유튜브 더보기</a>
                    </div>
                  </div>
                </div>
                ${isPlaying ? `
                  <div class="inline-player-container" data-stop-prop="true">
                    <iframe src="https://www.youtube.com/embed/${opt.videoId}?autoplay=1" title="${escapeHtml(opt.videoTitle)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                  </div>
                ` : ""}
              `;
            } else {
              mediaHtml = `
                <div class="media-btn-group">
                  <a href="${ytSearchUrl}" target="_blank" rel="noopener" class="button-pearl-capsule" data-stop-prop="true">귀갓길 코스 검색</a>
                </div>
              `;
            }
          } else {
            const tagsHtml = (opt.tags || []).map(t => `<span class="menu-pill-tag">${escapeHtml(t)}</span>`).join("");
            const qEnc = encodeURIComponent(opt.searchQuery);
            mediaHtml = `
              <div class="menu-tag-row">${tagsHtml}</div>
              <div class="media-btn-group">
                <a href="https://map.naver.com/p/search/${qEnc}" target="_blank" rel="noopener" class="button-primary compact" data-stop-prop="true">네이버 지도·사진 보기</a>
                <a href="https://search.naver.com/search.naver?where=view&query=${qEnc}" target="_blank" rel="noopener" class="button-pearl-capsule" data-stop-prop="true">블로그 후기 사진</a>
              </div>
            `;
          }

          return `
            <div class="vote-option-tile ${isLeading ? "leading" : ""}" role="button" tabindex="0" data-cast-opt="${idx}">
              <div class="vote-option-head">
                <span class="vote-option-title">${escapeHtml(opt.name)}</span>
                <span class="vote-count-badge">${count}표</span>
              </div>
              <div class="vote-option-desc">${escapeHtml(opt.meta)}</div>
              ${mediaHtml}
            </div>
          `;
        }).join("");

        bodyEl.innerHTML = `
          ${routeSwitcherHtml}
          <div class="voter-strip">
            <div class="voter-strip-head">
              <span>1단계 · 투표할 사람 선택 (${stats.totalVotes}/5명 참여 · 무기명)</span>
              <span style="color: var(--colors-primary);">
                ${activeVoter ? `'${activeVoter}' 선택됨 → 아래 카드를 누르세요` : "비밀 투표"}
              </span>
            </div>
            <div class="voter-pills">${voterBtnsHtml}</div>
          </div>
          <div class="vote-cards-stack">${optionsHtml}</div>
          ${renderMapBlock(item.lat, item.lng, item.address, item.address)}
        `;

        bodyEl.querySelectorAll("[data-stop-prop]").forEach(el => {
          el.addEventListener("click", e => e.stopPropagation());
        });

        bodyEl.querySelectorAll("[data-play-video]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            const idx = Number(btn.getAttribute("data-play-video"));
            playingVideoOptIdx = playingVideoOptIdx === idx ? null : idx;
            renderSheetContent(dayId, item);
          });
        });

        bodyEl.querySelectorAll("[data-switch-route]").forEach(btn => {
          btn.addEventListener("click", () => {
            const newKey = btn.getAttribute("data-switch-route");
            if (tripRef) {
              tripRef.child(`routeOverrides/${item.routeGroup}`).set(newKey);
            } else {
              appState.routeOverrides[item.routeGroup] = newKey;
              saveLocalCache();
            }
            const nextId = (item.routeGroup === "day1" ? "d1-lunch-" : "d3-lunch-") + newKey;
            currentModalContext = { type: "item", dayId, itemId: nextId };
            const refreshed = findItemById(dayId, nextId);
            if (refreshed) renderSheetContent(dayId, refreshed);
            renderMainSections();
          });
        });

        bodyEl.querySelectorAll("[data-pick-voter]").forEach(btn => {
          btn.addEventListener("click", () => {
            const m = btn.getAttribute("data-pick-voter");
            activeVoter = activeVoter === m ? null : m;
            renderSheetContent(dayId, item);
          });
        });

        bodyEl.querySelectorAll("[data-cast-opt]").forEach(cardBtn => {
          cardBtn.addEventListener("click", () => {
            if (!activeVoter) {
              showToast("먼저 위에서 투표할 사람(아빠·엄마·지후·은조·은후)을 눌러주세요.");
              return;
            }
            const optIdx = Number(cardBtn.getAttribute("data-cast-opt"));
            const votedPerson = activeVoter;
            activeVoter = null;
            playingVideoOptIdx = null;

            if (!appState.votes[item.id]) appState.votes[item.id] = {};
            appState.votes[item.id][votedPerson] = optIdx;

            if (tripRef) {
              tripRef.child(`votes/${item.id}/${votedPerson}`).set(optIdx);
              if (item.id === "d1-activity") tripRef.child("routeOverrides/day1").remove();
              if (item.id === "d3-sightseeing") tripRef.child("routeOverrides/day3").remove();
            } else {
              if (item.id === "d1-activity") delete appState.routeOverrides.day1;
              if (item.id === "d3-sightseeing") delete appState.routeOverrides.day3;
              saveLocalCache();
            }

            const refreshed = findItemById(dayId, item.id) || item;
            renderSheetContent(dayId, refreshed);
            renderMainSections();
            showToast(`${votedPerson}의 무기명 투표가 실시간 반영되었습니다.`);
          });
        });
      }
      // Case C: Fixed Schedule Detail with Map
      else {
        bodyEl.innerHTML = renderMapBlock(item.lat, item.lng, item.address, item.address);
      }

      const copyBtn = document.getElementById("btnSheetCopyAddr");
      if (copyBtn) {
        copyBtn.addEventListener("click", () => {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(item.address).then(() => showToast("주소가 복사되었습니다."));
          } else {
            showToast(item.address);
          }
        });
      }
    }

    function openItemSheet(dayId, itemId) {
      const item = findItemById(dayId, itemId);
      if (!item) return;
      activeVoter = null;
      playingVideoOptIdx = null;
      currentModalContext = { type: "item", dayId, itemId };
      renderSheetContent(dayId, item);
      modalBackdrop.classList.add("open");
      detailSheet.classList.add("open");
    }

    // Parent Budget Modal (Real-time synced)
    function openBudgetModal() {
      currentModalContext = { type: "budget" };
      document.getElementById("sheetHeadline").textContent = "예상 여행 경비";
      document.getElementById("sheetSubcopy").textContent = "부모 확인용 · 금액을 수정하면 실시간으로 저장됩니다";

      const renderBudgetBody = () => {
        const total = appState.budget.reduce((acc, b) => acc + (Number(b.amount) || 0), 0);
        const rowsHtml = appState.budget.map((b, idx) => `
          <div class="budget-row-item">
            <span>${escapeHtml(b.name)}</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <input type="number" class="budget-num-input" data-b-idx="${idx}" value="${b.amount}" step="1000" min="0" />
              <span>원</span>
            </div>
          </div>
        `).join("");

        document.getElementById("sheetDynamicBody").innerHTML = `
          <div class="budget-total-banner">
            <span style="font-weight: 600;">예상 총 경비</span>
            <span id="budgetGrandTotal" style="font-size: 24px; font-weight: 600; color: var(--colors-primary);">${total.toLocaleString()}원</span>
          </div>
          <div>${rowsHtml}</div>
        `;

        document.querySelectorAll("[data-b-idx]").forEach(inp => {
          inp.addEventListener("change", e => {
            const idx = Number(e.target.getAttribute("data-b-idx"));
            appState.budget[idx].amount = Math.max(0, Number(e.target.value) || 0);
            if (tripRef) {
              tripRef.child("budget").set(appState.budget);
            } else {
              saveLocalCache();
            }
            const newTotal = appState.budget.reduce((acc, b) => acc + (Number(b.amount) || 0), 0);
            document.getElementById("budgetGrandTotal").textContent = `${newTotal.toLocaleString()}원`;
          });
        });
      };

      renderBudgetBody();
      modalBackdrop.classList.add("open");
      detailSheet.classList.add("open");
    }

    function closeSheet() {
      modalBackdrop.classList.remove("open");
      detailSheet.classList.remove("open");
      activeVoter = null;
      playingVideoOptIdx = null;
      currentModalContext = null;
      document.getElementById("sheetDynamicBody").innerHTML = "";
    }

    document.getElementById("btnOpenBudget").addEventListener("click", openBudgetModal);
    document.getElementById("btnCloseSheet").addEventListener("click", closeSheet);
    modalBackdrop.addEventListener("click", closeSheet);
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeSheet();
    });

    // Initial Render
    renderSubNav();
    renderMainSections();
  </script>
</body>
</html>
